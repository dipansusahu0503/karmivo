<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business One | servicedesk</title>
  <style>
    :root{--ink:#202033;--muted:#77758a;--line:#e9e7f0;--brand:#5b45e5;--soft:#f7f6ff;--green:#168a5b;--orange:#e78b35}
    *{box-sizing:border-box}body{margin:0;background:#f8f8fb;color:var(--ink);font:14px Arial,sans-serif;min-width:1050px}
    .shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:24px 17px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:19px;margin:0 10px 34px}.brand b{display:inline-grid;place-items:center;background:var(--brand);color:#fff;border-radius:8px;width:30px;height:30px;margin-right:8px}.caption{font-size:10px;color:#aaa6b8;letter-spacing:1.4px;font-weight:bold;margin:0 10px 9px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;color:#6f6b7d;padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:600}.nav button:hover,.nav button.active{background:var(--soft);color:var(--brand)}.bottom{margin-top:auto;border-top:1px solid var(--line);padding:18px 10px 0;color:var(--muted);font-size:12px}.main{padding:0 42px 42px}.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.crumb{color:var(--muted)}.top button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 14px;cursor:pointer}.hero{display:flex;justify-content:space-between;align-items:end;padding:38px 0 25px}.eyebrow{color:#a19daa;letter-spacing:1.7px;font-size:10px;font-weight:bold}.hero h1{font-size:32px;margin:12px 0 8px}.hero p{color:var(--muted);margin:0}.date{color:var(--muted);background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.metric span{color:var(--muted);font-size:12px}.metric strong{font-size:27px;display:block;margin:12px 0 4px}.metric small{color:var(--green)}.workspace{margin-top:20px;display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.panel h2{margin:0 0 5px;font-size:17px}.panel>p{color:var(--muted);margin:0 0 18px;font-size:12px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input,.form input,.form select{border:1px solid var(--line);border-radius:7px;padding:10px;background:#fff}.toolbar input{flex:1}.primary{background:var(--brand)!important;color:white;border:0;border-radius:7px;padding:10px 15px;font-weight:bold;cursor:pointer}.secondary{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 14px;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:#aaa6b1;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:10px 7px;border-bottom:1px solid var(--line)}td{padding:13px 7px;border-bottom:1px solid #f0eff4}td small{color:var(--muted)}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#eefaf4;color:var(--green);font-size:11px}.pill.warn{background:#fff5e8;color:#b66a16}.quick{display:grid;gap:9px}.quick button{text-align:left;background:var(--soft);border:0;border-radius:8px;padding:13px;cursor:pointer;color:var(--brand);font-weight:bold}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.form label{display:grid;gap:6px;color:var(--muted);font-size:11px}.form button{grid-column:1/-1;justify-self:start}.empty{text-align:center;color:var(--muted);padding:30px}.toast{position:fixed;right:24px;bottom:24px;background:#202033;color:#fff;padding:13px 17px;border-radius:8px;display:none}
  </style>
</head>
<body>
  <div class="shell"><aside class="side"><div class="brand"><b>S</b>servicedesk</div><p class="caption">BUSINESS ONE MODULES</p><nav class="nav" id="nav"></nav><div class="bottom">Desktop web workspace<br><strong>Workspace admin</strong></div></aside>
    <main class="main"><header class="top"><span class="crumb">Workspace / <strong id="moduleCrumb">Business One</strong></span><div><button id="home">Back to services</button></div></header><section class="hero"><div><span class="eyebrow" id="eyebrow">BUSINESS ONE</span><h1 id="title">Business One</h1><p id="subtitle">Operational workspace</p></div><span class="date">18 Nov 2026</span></section><section class="metrics" id="metrics"></section><section class="workspace"><div class="panel"><h2 id="tableTitle">Recent activity</h2><p id="tableHint">Create and manage records in this module.</p><div id="formSlot"></div><div class="toolbar"><input id="search" placeholder="Search records..."><button class="secondary" id="refresh">Refresh</button><button class="primary" id="newRecord">+ New record</button></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div><div class="panel"><h2>Quick actions</h2><p>Common tasks for this module.</p><div class="quick" id="quick"></div></div></section></main></div><div class="toast" id="toast"></div>
  <script>
    const configs={
      'finance-accounting':{name:'Finance & Accounting',desc:'Control the financial core of your business.',records:'Journal entries',fields:['Reference','Account','Amount'],seed:[['JE-1001','Office expense','₹24,500','Posted'],['JE-1002','Customer receipt','₹82,000','Draft']],actions:['Create journal entry','Record incoming payment','Open trial balance']},
      purchasing:{name:'Purchasing',desc:'Source goods and manage the procure-to-pay cycle.',records:'Purchase orders',fields:['Vendor','Item','Quantity'],seed:[['PO-10021','Global Wholesale','Women Denim × 2','Open'],['PO-10020','ABC Distributors','Classic Shirt × 3','Received']],actions:['Create purchase order','Add vendor','Receive goods']},
      sales:{name:'Sales',desc:'Manage the complete order-to-cash process.',records:'Sales orders',fields:['Customer','Item','Value'],seed:[['SO-2041','Acme Retail','Shirt A23','₹48,000'],['SO-2040','Northwind Stores','Women Denim','₹32,500']],actions:['Create sales order','Add customer','Create invoice']},
      'inventory-management':{name:'Inventory management',desc:'Know what is available, committed, and moving.',records:'Inventory items',fields:['SKU','Item name','Available'],seed:[['SH-8574','Shirt A23','540 units','Healthy'],['WM-2201','Women Denim','2 units','Low stock']],actions:['Add item','Transfer stock','Run stock count']},
      banking:{name:'Banking',desc:'Monitor cash, payments, and bank reconciliation.',records:'Bank transactions',fields:['Bank account','Reference','Amount'],seed:[['HDFC-01','NEFT receipt','₹82,000','Reconciled'],['ICICI-02','Supplier payment','₹24,500','Pending']],actions:['Record payment','Reconcile account','Add bank account']},
      production:{name:'Production',desc:'Plan and execute your manufacturing operations.',records:'Production orders',fields:['Product','Planned qty','Due date'],seed:[['Shirt A23','100','22 Nov 2026','Released'],['Women Denim','50','25 Nov 2026','Planned']],actions:['Create production order','Manage bill of material','Issue components']},
      'human-resources':{name:'Human resources',desc:'Organize people, attendance, leave, and payroll inputs.',records:'Employees',fields:['Employee','Department','Manager'],seed:[['Dipansu Sahu','Operations','Warehouse'],['Aarav Mehta','Sales','Revenue']],actions:['Add employee','Approve leave','Attendance register']},
      crm:{name:'CRM',desc:'Build stronger relationships from lead to loyal customer.',records:'Sales opportunities',fields:['Company','Contact','Value'],seed:[['Acme Retail','Riya Sharma','₹1.2L','Open'],['Northwind Stores','Vikram Singh','₹85K','Qualified']],actions:['Add lead','Create opportunity','Plan follow-up']}
    };
    const id=location.pathname.split('/').pop(), cfg=configs[id]||configs.crm, key='business-one-'+id;
    const API_BASES={operations:'http://localhost:8001',commercial:'http://localhost:8002','finance-people':'http://localhost:8003'};
    const serviceFor={purchasing:'commercial',sales:'commercial',crm:'commercial','inventory-management':'operations','warehouse-management':'operations',production:'operations','finance-accounting':'finance-people',banking:'finance-people','human-resources':'finance-people'};
    const apiBase=API_BASES[serviceFor[id]]; let state=JSON.parse(localStorage.getItem(key)||'null')||cfg.seed.map((r,i)=>({id:Date.now()+i,values:r}));
    const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function save(){localStorage.setItem(key,JSON.stringify(state))} async function loadRemote(){try{const response=await fetch(`${apiBase}/api/records/?module=${encodeURIComponent(id)}`);if(!response.ok)throw Error('API unavailable');const data=await response.json();if(data.records.length){state=data.records.map(row=>({id:row.id,values:[...cfg.fields.map(field=>row.data[field]||''),row.status],remote:true}));save();render();}}catch(error){notify('Showing local demo data; backend is offline.')}} function notify(t){const el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1800)}
    function renderNav(){$('#nav').innerHTML=`<button class="active">${esc(cfg.name)}</button><button id="allServices">← All services</button>`;$('#allServices').onclick=()=>location.href='/'}
    function render(){
      $('#moduleCrumb').textContent=cfg.name;$('#title').textContent=cfg.name;$('#subtitle').textContent=cfg.desc;$('#tableTitle').textContent=cfg.records;$('#tableHint').textContent=`${state.length} records in this company workspace.`;renderNav();
      $('#metrics').innerHTML=[['Open tasks',Math.max(3,state.length+2),'Across this module'],['This month','₹2.48L','Posted activity'],['Active records',state.length,'Live workspace'],['System status','Ready','All services online']].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');
      $('#thead').innerHTML='<tr><th>Record</th>'+cfg.fields.map(f=>`<th>${f}</th>`).join('')+'<th>Status</th><th>Action</th></tr>';
      const q=$('#search').value.toLowerCase();const rows=state.filter(r=>r.values.join(' ').toLowerCase().includes(q));$('#tbody').innerHTML=rows.length?rows.map((r)=>`<tr><td><strong>${cfg.records.slice(0,-1)} #${String(r.id).slice(-4)}</strong></td>${r.values.slice(0,-1).map(v=>`<td>${esc(v)}</td>`).join('')}<td><span class="pill ${String(r.values.at(-1)).toLowerCase().includes('pending')?'warn':''}">${esc(r.values.at(-1)||'Open')}</span></td><td><button class="secondary" data-done="${r.id}">Complete</button></td></tr>`).join(''):`<tr><td class="empty" colspan="${cfg.fields.length+3}">No records found.</td></tr>`;
       document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{const r=state.find(x=>x.id==b.dataset.done);if(r){r.values[r.values.length-1]='Completed';if(r.remote)await fetch(`${apiBase}/api/records/${encodeURIComponent(r.id)}/`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'Completed'})});save();render();notify('Record updated')}});
      $('#quick').innerHTML=cfg.actions.map(a=>`<button data-quick="${esc(a)}">${esc(a)} <span>→</span></button>`).join('');document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>showForm(b.dataset.quick));
    }
    function showForm(label='New record'){$('#formSlot').innerHTML=`<form class="form" id="recordForm">${cfg.fields.map((f,i)=>`<label>${f}<input name="field${i}" required placeholder="Enter ${f.toLowerCase()}"></label>`).join('')}<button class="primary" type="submit">Save ${esc(label.toLowerCase())}</button></form>`;$('#recordForm').onsubmit=async e=>{e.preventDefault();const values=[...new FormData(e.currentTarget).values()];const data=Object.fromEntries(cfg.fields.map((field,index)=>[field,values[index]]));let record={id:Date.now(),values:[...values,'Open']};try{const response=await fetch(`${apiBase}/api/records/`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:id,data})});if(response.ok){const result=await response.json();record.id=result.record.id;record.remote=true}else throw Error('API unavailable')}catch(error){notify('Backend unavailable; saved in local demo mode')}state.unshift(record);save();$('#formSlot').innerHTML='';render();notify(record.remote?'Record synced to service database':'Record created locally')}}
    $('#search').oninput=render;$('#refresh').onclick=()=>{render();loadRemote();notify('Data refreshed')};$('#newRecord').onclick=()=>showForm();$('#home').onclick=()=>location.href='/';render();loadRemote();
  </script>
</body></html>
